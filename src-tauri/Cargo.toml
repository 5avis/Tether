[package]
name = "tether"
version = "0.1.0"
description = "Tether - Unified Multi-Cloud Infrastructure & Tunnel Control Plane"
authors = ["Siva"]
edition = "2021"

[lib]
name = "tether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"

# Cargo release profile for aggressive binary size optimization
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
